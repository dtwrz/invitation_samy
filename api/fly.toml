# fly.toml app configuration file generated for invitation-samy on 2026-11-27T00:25:42Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'invitation-samy'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  ADDR = ':8080'
  COOKIE_SAMESITE = 'lax'
  DATABASE_DSN = 'file:/data/invitation.db?_pragma=journal_mode(WAL)&_pragma=busy_timeout(5000)&_pragma=foreign_keys(1)'
  STORAGE_DRIVER = 'cloudinary'

[[mounts]]
  source = 'datos'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
